name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 07:00 UTC
    - cron: '0 7 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build for CodeQL
        run: pnpm build
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  create-issue-on-findings:
    name: Create Issue for Critical Findings
    runs-on: ubuntu-latest
    needs: analyze
    if: failure()

    steps:
      - name: Create issue for CodeQL failures
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'codeql-failure,automated',
              state: 'open'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔍 CodeQL Analysis Found Security Issues',
                body: `## CodeQL Security Analysis Failed

            The CodeQL security scan has identified potential issues in the codebase.

            **Workflow Run:** [View Details](${runUrl})

            ### Action Required
            1. Review the CodeQL findings in the Security tab
            2. Address critical and high severity issues
            3. This issue will auto-close when the scan passes

            ---
            *Auto-generated by CodeQL workflow*`,
                labels: ['security', 'codeql-failure', 'claude-action', 'automated']
              });
            } else {
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `CodeQL scan still failing. [Latest run](${runUrl})`
              });
            }
