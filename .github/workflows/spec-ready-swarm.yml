name: Swarm on Spec Ready

on:
  pull_request:
    types: [closed]
    paths:
      - 'docs/specs/**'

jobs:
  trigger-swarm:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Extract spec metadata
        id: meta
        run: |
          # Get the spec file that was merged
          SPEC_FILE=$(git diff-tree --no-commit-id --name-only -r HEAD | grep 'docs/specs/' | head -1)
          echo "spec_path=$SPEC_FILE" >> $GITHUB_OUTPUT

          if [[ -z "$SPEC_FILE" ]]; then
            echo "No spec file found in merge"
            exit 1
          fi

          # Extract exec mode from spec frontmatter (default: quick)
          EXEC_MODE=$(grep -oP 'exec:\s*\K\w+' "$SPEC_FILE" 2>/dev/null || echo "quick")
          echo "exec_mode=$EXEC_MODE" >> $GITHUB_OUTPUT

          # Extract environment from spec frontmatter
          # Auto-detect terminal for swarm/long-running/batch modes
          ENV_MODE=$(grep -oP 'env:\s*\K\w+' "$SPEC_FILE" 2>/dev/null || echo "")
          if [[ -z "$ENV_MODE" ]]; then
            case "$EXEC_MODE" in
              swarm|long-running|batch) ENV_MODE="terminal" ;;
              *) ENV_MODE="desktop" ;;
            esac
          fi
          echo "env_mode=$ENV_MODE" >> $GITHUB_OUTPUT

          # Extract Linear issue reference if present
          LINEAR_ISSUE=$(grep -oP 'linear:\s*\K[A-Z]+-\d+' "$SPEC_FILE" 2>/dev/null || echo "")
          echo "linear_issue=$LINEAR_ISSUE" >> $GITHUB_OUTPUT

          echo "Found spec: $SPEC_FILE"
          echo "Exec mode: $EXEC_MODE"
          echo "Environment: $ENV_MODE"
          echo "Linear issue: $LINEAR_ISSUE"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Spawn implementation swarm
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude-code --print "
          You are implementing a specification that has passed adversarial review.

          Spec file: ${{ steps.meta.outputs.spec_path }}
          Execution mode: ${{ steps.meta.outputs.exec_mode }}
          Environment: ${{ steps.meta.outputs.env_mode }}
          Linear issue: ${{ steps.meta.outputs.linear_issue }}

          Instructions:
          1. Read the spec file completely
          2. Parse acceptance criteria into testable requirements
          3. Follow the exec mode guidance:
             - quick: Direct implementation, minimal ceremony
             - tdd: Write failing tests first, then implement
             - swarm: Use claude-flow MCP for parallel task execution
             - checkpoint: Pause at each milestone for verification
             - pair: Flag decision points for human input
             - long-running: Extended execution with checkpointing
             - batch: Bulk operations with progress tracking
          4. Implement the specification
          5. Run verification: pnpm typecheck, pnpm test, pnpm lint
          6. Commit changes with message referencing the Linear issue
          7. Do not push - the workflow will handle that
          "

      - name: Push changes
        run: |
          git config user.name "Claude Code"
          git config user.email "claude-code[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to push"
          else
            git add -A
            git commit -m "feat: implement spec ${{ steps.meta.outputs.spec_path }}

            Closes ${{ steps.meta.outputs.linear_issue }}

            Exec mode: ${{ steps.meta.outputs.exec_mode }}

            Co-Authored-By: Claude Code <claude-code[bot]@users.noreply.github.com>"
            git push
          fi

      - name: Comment on PR
        if: steps.meta.outputs.linear_issue != ''
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "Implementation swarm triggered for spec.

            - **Exec mode:** ${{ steps.meta.outputs.exec_mode }}
            - **Linear issue:** ${{ steps.meta.outputs.linear_issue }}

            Check the [Actions log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for progress."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
