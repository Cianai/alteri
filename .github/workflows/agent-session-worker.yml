name: Agent Session Worker

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'Linear agent session ID'
        required: true
        type: string
      intent_type:
        description: 'Parsed intent type (status, expand, help, unknown)'
        required: true
        type: string
      issue_id:
        description: 'Linear issue identifier (e.g. CIA-123)'
        required: true
        type: string
      prompt_context:
        description: 'Prompt context XML from Linear'
        required: false
        type: string
      prompt_body:
        description: 'Prompt body (for prompted events)'
        required: false
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Process agent session
        env:
          LINEAR_AGENT_TOKEN: ${{ secrets.LINEAR_AGENT_TOKEN }}
          SESSION_ID: ${{ inputs.session_id }}
          INTENT: ${{ inputs.intent_type }}
          ISSUE_ID: ${{ inputs.issue_id }}
          PROMPT_CONTEXT: ${{ inputs.prompt_context }}
          PROMPT_BODY: ${{ inputs.prompt_body }}
        run: |
          pnpm --filter @alteri/agent-session exec tsx -e "
            import { LinearAgentClient } from './src/linear-client.ts';
            import { routeIntent } from './src/handlers/index.ts';

            (async () => {
              const token = process.env.LINEAR_AGENT_TOKEN;
              const sessionId = process.env.SESSION_ID;
              const intent = process.env.INTENT;
              const issueId = process.env.ISSUE_ID;
              const promptContext = process.env.PROMPT_CONTEXT ?? '';
              const commentBody = process.env.PROMPT_BODY ?? '';

              console.log('[worker] starting', { sessionId, intent, issueId, hasToken: !!token });

              const client = new LinearAgentClient(token);

              // Post thinking activity
              const thoughtResult = await client.postActivity(sessionId, {
                type: 'thought',
                body: 'Processing ' + intent + ' request for ' + issueId + '...',
              });
              console.log('[worker] thought result:', JSON.stringify(thoughtResult));

              // Route to handler
              const response = await routeIntent(
                intent,
                {
                  sessionId,
                  issueId,
                  issueIdentifier: issueId,
                  promptContext,
                  commentBody,
                },
                client,
              );
              console.log('[worker] handler response length:', response?.length ?? 0);

              // Post response
              const result = await client.postActivity(sessionId, {
                type: 'response',
                body: response,
              });
              console.log('[worker] response result:', JSON.stringify(result));

              if (!result.success) {
                console.error('[worker] Failed to post response:', result.error);
                const errResult = await client.postActivity(sessionId, {
                  type: 'error',
                  body: 'Failed to generate response: ' + (result.error ?? 'unknown error'),
                });
                console.log('[worker] error activity result:', JSON.stringify(errResult));
                process.exit(1);
              }

              console.log('[worker] Successfully processed session', sessionId, '(intent:', intent + ')');
            })();
          "
