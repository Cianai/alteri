name: Agent Session Worker

on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: 'Linear issue identifier (e.g. CIA-123)'
        required: true
        type: string
      session_id:
        description: 'Linear agent session ID for progress updates'
        required: true
        type: string
      intent:
        description: 'Intent type (expand)'
        required: true
        type: string

jobs:
  expand-spec:
    if: inputs.intent == 'expand'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Resolve inputs
        id: inputs
        run: |
          SLUG=$(echo "${{ inputs.issue_id }}" | tr '[:upper:]' '[:lower:]')
          echo "branch=agent/${SLUG}-expand" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create branch
        run: git checkout -b ${{ steps.inputs.outputs.branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch spec from Linear
        id: spec
        env:
          LINEAR_ACCESS_TOKEN: ${{ secrets.LINEAR_ACCESS_TOKEN }}
        run: |
          ISSUE_ID="${{ inputs.issue_id }}"
          RESPONSE=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_ACCESS_TOKEN" \
            -d "{\"query\": \"{ issueSearch(filter: { identifier: { eq: \\\"${ISSUE_ID}\\\" } }) { nodes { title description } } }\"}")

          TITLE=$(echo "$RESPONSE" | jq -r '.data.issueSearch.nodes[0].title // empty')
          DESCRIPTION=$(echo "$RESPONSE" | jq -r '.data.issueSearch.nodes[0].description // empty')

          if [[ -z "$TITLE" ]]; then
            echo "Could not fetch issue from Linear"
            exit 1
          fi

          echo "$DESCRIPTION" > /tmp/spec.md
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Expand with Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ISSUE_ID="${{ inputs.issue_id }}"

          claude-code --print "
          You are expanding a specification from a Linear issue, triggered by an @claude expand mention.

          Linear issue: ${ISSUE_ID}

          $(cat /tmp/spec.md)

          Instructions:
          1. Read the specification above carefully
          2. Parse acceptance criteria into testable requirements
          3. Implement the feature following existing patterns in the codebase
          4. Run verification: pnpm typecheck && pnpm lint
          5. Commit changes referencing the Linear issue
          6. Do not push - the workflow handles that
          "

      - name: Verify build
        run: pnpm typecheck && pnpm lint

      - name: Push and create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Claude Code"
          git config user.email "claude-code[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to push"
            exit 0
          fi

          git add -A
          git commit -m "feat: expand ${{ inputs.issue_id }}

          Triggered by @claude expand in Linear agent session.

          Co-Authored-By: Claude Code <claude-code[bot]@users.noreply.github.com>"

          git push -u origin ${{ steps.inputs.outputs.branch }}

          gh pr create \
            --title "feat: expand ${{ steps.spec.outputs.title }}" \
            --body "## Agent Session Expansion

          Expands **${{ inputs.issue_id }}** triggered by \`@claude expand\` in Linear.

          ## Review Checklist
          - [ ] Acceptance criteria met
          - [ ] Types pass (\`pnpm typecheck\`)
          - [ ] Lint passes (\`pnpm lint\`)
          - [ ] Vercel preview works

          ---
          *Auto-generated by agent-session-worker*" \
            --base main
