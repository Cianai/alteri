name: Create Spec Review Issues
on:
  push:
    paths: ['docs/specs/**/*.md']
    branches: ['main']  # Only on merge to main

jobs:
  create-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed spec files
        id: specs
        run: |
          FILES=$(git diff --name-only HEAD~1 -- docs/specs/)
          echo "files=$FILES" >> $GITHUB_OUTPUT

          if [[ -z "$FILES" ]]; then
            echo "No spec files changed"
            exit 0
          fi

          echo "Changed specs: $FILES"

      - name: Create challenger review issue
        if: steps.specs.outputs.files != ''
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Spec Review: Challenger - ${process.env.SPEC_FILES}`,
              body: `## Challenger Review\n\nReview the following spec(s) as an adversarial challenger. Find gaps, ambiguities, contradictions, and unstated assumptions. Be thorough and adversarial.\n\nFiles: ${process.env.SPEC_FILES}\n\nRead the full spec content from the repository and provide your findings as a draft PR.`,
              assignees: ['copilot'],
              labels: ['spec-review', 'challenger']
            });
        env:
          SPEC_FILES: ${{ steps.specs.outputs.files }}

      - name: Create security review issue
        if: steps.specs.outputs.files != ''
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Spec Review: Security - ${process.env.SPEC_FILES}`,
              body: `## Security Review\n\nReview the following spec(s) for security implications. Identify attack vectors, data handling risks, privacy concerns, and compliance gaps.\n\nFiles: ${process.env.SPEC_FILES}\n\nRead the full spec content from the repository and provide your findings as a draft PR.`,
              assignees: ['copilot'],
              labels: ['spec-review', 'security']
            });
        env:
          SPEC_FILES: ${{ steps.specs.outputs.files }}

      - name: Create devil's advocate issue
        if: steps.specs.outputs.files != ''
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Spec Review: Alternative Approaches - ${process.env.SPEC_FILES}`,
              body: `## Devil's Advocate\n\nChallenge the fundamental approach of the following spec(s). Propose completely different alternatives. Question core assumptions.\n\nFiles: ${process.env.SPEC_FILES}\n\nRead the full spec content from the repository and provide your findings as a draft PR.`,
              assignees: ['copilot'],
              labels: ['spec-review', 'alternative']
            });
        env:
          SPEC_FILES: ${{ steps.specs.outputs.files }}
