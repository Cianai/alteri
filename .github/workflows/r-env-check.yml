name: R Environment Check

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 9am UTC
  workflow_dispatch:
  push:
    paths:
      - 'packages/r-analysis/renv.lock'
      - 'packages/r-analysis/scripts/**'

jobs:
  check-renv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/r-analysis

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v5
        id: cache-renv
        with:
          path: |
            ~/.local/share/renv
            packages/r-analysis/renv/library
          key: ${{ runner.os }}-renv-${{ hashFiles('packages/r-analysis/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Install renv
        run: install.packages("renv")
        shell: Rscript {0}

      - name: Restore R packages
        timeout-minutes: 15
        run: |
          options(renv.config.install.verbose = TRUE)
          options(renv.download.trace = TRUE)
          renv::restore(prompt = FALSE)
        shell: Rscript {0}

      - name: Check renv status
        timeout-minutes: 2
        run: |
          status <- renv::status()
          if (!is.null(status$library$Packages) && nrow(status$library$Packages) > 0) {
            cat("WARNING: Packages out of sync with lockfile\n")
            print(status$library$Packages)
            quit(status = 1)
          }
          cat("renv status: OK - lockfile is in sync\n")
        shell: Rscript {0}

      - name: Verify PSYNETS packages
        timeout-minutes: 5
        run: |
          psynets <- c("bootnet", "BGGM", "gimme", "NetworkComparisonTest",
                       "networktools", "EGAnet", "lvnet")

          for (pkg in psynets) {
            if (!requireNamespace(pkg, quietly = TRUE)) {
              stop(paste("PSYNETS package missing:", pkg))
            }
            cat(paste0("OK: ", pkg, " (", packageVersion(pkg), ")\n"))
          }
        shell: Rscript {0}

      - name: Check for outdated packages
        timeout-minutes: 5
        run: |
          old <- renv::update(check = TRUE)
          if (length(old) > 0) {
            cat("\n--- Packages with available updates ---\n")
            print(old)
          } else {
            cat("All packages are up to date\n")
          }
        shell: Rscript {0}
        continue-on-error: true
