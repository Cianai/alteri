name: Claude Code Auto-fix

on:
  issues:
    types: [labeled]

jobs:
  auto-fix:
    if: github.event.label.name == 'claude-action'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Generate claudegbot App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CLAUDEGBOT_APP_ID }}
          private-key: ${{ secrets.CLAUDEGBOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Read issue details
        id: issue
        run: |
          echo "title=${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
          gh issue view ${{ github.event.issue.number }} --json body -q .body > issue_body.txt
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Run Claude Code fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude-code --print "
          Fix GitHub issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

          Issue details:
          $(cat issue_body.txt)

          Instructions:
          1. Analyse the failure described in the issue
          2. Make the minimal fix required
          3. Run verification (pnpm typecheck, pnpm test, pnpm lint) to confirm fix works
          4. Commit with message: fix: resolve issue #${{ github.event.issue.number }}
          5. Do not push - the workflow will handle that
          "

      - name: Create branch and push fix
        run: |
          BRANCH="fix/issue-${{ github.event.issue.number }}"
          git config user.name "claudegbot[bot]"
          git config user.email "claudegbot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Open PR
        run: |
          gh pr create \
            --title "fix: resolve issue #${{ github.event.issue.number }}" \
            --body "Closes #${{ github.event.issue.number }}" \
            --head "$BRANCH" \
            --base main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
