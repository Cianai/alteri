name: Voice Auto-Implement

on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: 'Linear issue ID (e.g. CIA-123)'
        required: true
        type: string
      title:
        description: 'Feature title for branch naming'
        required: true
        type: string

  issues:
    types: [labeled]

jobs:
  auto-implement:
    # Run on dispatch OR when auto:implement label is added
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'auto:implement')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Resolve inputs
        id: inputs
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "issue_id=${{ inputs.issue_id }}" >> $GITHUB_OUTPUT
            SLUG=$(echo "${{ inputs.title }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | head -c 50)
            echo "branch=voice/${{ inputs.issue_id }}-${SLUG}" >> $GITHUB_OUTPUT
          else
            # Extract from issue title: "[CIA-123] Feature title"
            TITLE="${{ github.event.issue.title }}"
            ISSUE_ID=$(echo "$TITLE" | grep -oP '\[([A-Z]+-\d+)\]' | tr -d '[]' || echo "VOICE-${{ github.event.issue.number }}")
            echo "issue_id=$ISSUE_ID" >> $GITHUB_OUTPUT
            SLUG=$(echo "$TITLE" | sed 's/\[.*\] *//' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | head -c 50)
            echo "branch=voice/${ISSUE_ID}-${SLUG}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Create branch
        run: |
          git checkout -b ${{ steps.inputs.outputs.branch }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch spec from Linear
        id: spec
        env:
          LINEAR_ACCESS_TOKEN: ${{ secrets.LINEAR_ACCESS_TOKEN }}
        run: |
          # Fetch issue description from Linear API
          ISSUE_ID="${{ steps.inputs.outputs.issue_id }}"
          RESPONSE=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_ACCESS_TOKEN" \
            -d "{\"query\": \"{ issueSearch(filter: { identifier: { eq: \\\"${ISSUE_ID}\\\" } }) { nodes { title description } } }\"}")

          TITLE=$(echo "$RESPONSE" | jq -r '.data.issueSearch.nodes[0].title // empty')
          DESCRIPTION=$(echo "$RESPONSE" | jq -r '.data.issueSearch.nodes[0].description // empty')

          if [[ -z "$TITLE" ]]; then
            echo "Could not fetch issue from Linear"
            exit 1
          fi

          # Write spec to temp file for Claude
          cat > /tmp/spec.md << 'SPECEOF'
          $TITLE

          $DESCRIPTION
          SPECEOF

          # Use env file for multiline output
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Implement with Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ISSUE_ID="${{ steps.inputs.outputs.issue_id }}"

          claude-code --print "
          You are implementing a feature from a voice-captured specification.

          Linear issue: ${ISSUE_ID}

          $(cat /tmp/spec.md)

          Instructions:
          1. Read the specification above carefully
          2. Parse acceptance criteria into testable requirements
          3. Implement the feature following existing patterns in the codebase
          4. Run verification: pnpm typecheck && pnpm lint
          5. Commit changes referencing the Linear issue
          6. Do not push - the workflow handles that
          "

      - name: Verify build
        run: pnpm typecheck && pnpm lint

      - name: Push and create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Claude Code"
          git config user.email "claude-code[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to push"
            exit 0
          fi

          git add -A
          git commit -m "feat: implement ${{ steps.inputs.outputs.issue_id }}

          Closes ${{ steps.inputs.outputs.issue_id }}

          Co-Authored-By: Claude Code <claude-code[bot]@users.noreply.github.com>"

          git push -u origin ${{ steps.inputs.outputs.branch }}

          gh pr create \
            --title "feat: ${{ steps.spec.outputs.title }}" \
            --body "## Auto-Implementation

          Closes **${{ steps.inputs.outputs.issue_id }}**

          ## Review Checklist
          - [ ] Acceptance criteria met
          - [ ] Types pass (\`pnpm typecheck\`)
          - [ ] Lint passes (\`pnpm lint\`)
          - [ ] Vercel preview works

          ---
          *Auto-generated by auto-implement pipeline*" \
            --base main

          # Enable auto-merge so PR merges automatically after CI passes
          gh pr merge --auto --squash
