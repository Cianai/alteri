name: Security Alert Auto-Triage

on:
  # Triggers when Dependabot creates security PRs
  pull_request:
    types: [opened]
  # Also on security advisory events
  repository_vulnerability_alert:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: read

jobs:
  triage-security-pr:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && contains(github.event.pull_request.title, 'security') || contains(github.event.pull_request.labels.*.name, 'security')

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Label security PRs for Claude Code
        run: |
          gh pr edit "$PR_URL" --add-label "security,claude-action"
          gh pr comment "$PR_URL" --body "🔒 **Security Update Detected**

          This PR addresses a security vulnerability. It has been labeled for Claude Code auto-fix review.

          **Severity:** ${{ steps.metadata.outputs.alert-severity || 'Unknown' }}
          **Update type:** ${{ steps.metadata.outputs.update-type }}

          If tests pass, this will be auto-merged. Otherwise, Claude Code will attempt remediation."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-issue-for-advisory:
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_vulnerability_alert'

    steps:
      - name: Create issue for security advisory
        uses: actions/github-script@v7
        with:
          script: |
            const alert = context.payload.alert;
            const severity = alert.severity || 'unknown';
            const package_name = alert.affected_package_name || 'unknown package';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 Security: ${package_name} vulnerability (${severity})`,
              body: `## Security Advisory

            **Package:** ${package_name}
            **Severity:** ${severity}
            **CVE:** ${alert.external_identifier || 'N/A'}

            ### Description
            ${alert.description || 'No description provided'}

            ### Action Required
            This issue has been auto-labeled for Claude Code to investigate and propose a fix.

            ---
            *Auto-generated by security-auto-triage workflow*`,
              labels: ['security', 'claude-action', 'automated']
            });
